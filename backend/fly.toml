# fly.toml app configuration file generated for quill-backend on 2026-03-13T16:46:27-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quill-backend'
primary_region = 'yyz'

[build]

# Persistent SQLite at /data/app.db. Worksheets load from JSON only when DB is empty (first deploy).
# To add new worksheet JSON after that, SSH in and run from /app with the image venv
# (plain `python` is often wrong — no deps, wrong cwd → ModuleNotFoundError):
#   cd /app && QUILL_DATA_DIR=/data /app/.venv/bin/python seed_worksheets.py --merge
# Or set secret MERGE_WORKSHEETS_JSON_ON_START=1 for one deploy, then remove it.
# Scheduled jobs: set fly secret QUILL_CRON_SECRET, header X-Quill-Cron-Key: <secret>
#   POST /cron/merge-worksheets — merge worksheet JSON from disk; optional ?subjects=math,english
#     Script: ./scripts/cron_merge_worksheets.sh
# Learn resource images (Tigris): set fly secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#   AWS_ENDPOINT_URL_S3, BUCKET_NAME. Images are served via GET /learn/assets/… (private bucket OK).
#   Optional LEARN_ASSETS_PUBLIC_BASE_URL for direct public Tigris URLs instead of the proxy.
# One-time: fly volumes create quill_data --region yyz --size 1
[mounts]
  source = "quill_data"
  destination = "/data"
  processes = ["app"]

[env]
  QUILL_DATA_DIR = "/data"
  QUILL_PUBLIC_API_URL = "https://quill-backend.fly.dev"
  QUILL_SIGNUP_ENABLED = "0"
  # First boot from legacy auth.json: student password is bcrypt(DEFAULT_STUDENT_PASSWORD); default "changeme".

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
