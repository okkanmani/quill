<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quill</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@400;600;700&family=Fraunces:opsz,wght@9..144,400;600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&family=Literata:opsz,wght@7..72,400;600;700&family=Merriweather:wght@400;700&family=Nunito:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap"
          rel="stylesheet"
        />
        <script>
          function quillAppearanceUserKey() {
            try {
              if (!localStorage.getItem("token")) return "guest";
              var role = localStorage.getItem("role");
              var studentName = localStorage.getItem("studentName");
              function safe(value) {
                return String(value || "default").replace(/:/g, "_");
              }
              if (role === "admin") {
                if (studentName) return "student:" + safe(studentName);
                return "admin:" + safe(localStorage.getItem("adminName"));
              }
              return "student:" + safe(localStorage.getItem("name"));
            } catch (e) {
              return "guest";
            }
          }
          function quillScopedKey(baseKey) {
            return baseKey + ":" + quillAppearanceUserKey();
          }
          function quillReadScoped(baseKey, fallback) {
            try {
              var scopedKey = quillScopedKey(baseKey);
              var scoped = localStorage.getItem(scopedKey);
              if (scoped != null) return scoped;
              var legacy = localStorage.getItem(baseKey);
              if (legacy != null) {
                localStorage.setItem(scopedKey, legacy);
                return legacy;
              }
            } catch (e) {}
            return fallback;
          }
          try {
            var theme = quillReadScoped("quillColorTheme", "default");
            document.documentElement.dataset.theme = theme;
            var darkThemes = { midnight: 1, charcoal: 1, wine: 1 };
            document.documentElement.dataset.themeMode = darkThemes[theme]
              ? "dark"
              : "light";
          } catch (e) {
            document.documentElement.dataset.theme = "default";
            document.documentElement.dataset.themeMode = "light";
          }
          try {
            var fonts = {
              system:
                'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
              inter: '"Inter", system-ui, sans-serif',
              source: '"Source Sans 3", system-ui, sans-serif',
              literata: '"Literata", Georgia, "Times New Roman", serif',
              merriweather: '"Merriweather", Georgia, "Times New Roman", serif',
              hyperlegible: '"Atkinson Hyperlegible", system-ui, sans-serif',
              nunito: '"Nunito", system-ui, sans-serif',
              bitter: '"Bitter", Georgia, "Times New Roman", serif',
              fraunces: '"Fraunces", Georgia, "Times New Roman", serif',
              jetbrains:
                '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
              "space-grotesk": '"Space Grotesk", system-ui, sans-serif',
            };
            var fontId = quillReadScoped("quillFont", "system");
            var stack = fonts[fontId] || fonts.system;
            document.documentElement.dataset.font = fontId in fonts ? fontId : "system";
            document.documentElement.style.setProperty("--quill-font-family", stack);
          } catch (e) {
            document.documentElement.dataset.font = "system";
          }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
