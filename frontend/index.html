<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quill</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;600;700&family=Literata:opsz,wght@7..72,400;600;700&family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap"
          rel="stylesheet"
        />
        <script>
          try {
            var theme = localStorage.getItem("quillColorTheme") || "default";
            document.documentElement.dataset.theme = theme;
          } catch (e) {
            document.documentElement.dataset.theme = "default";
          }
          try {
            var fonts = {
              system:
                'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
              inter: '"Inter", system-ui, sans-serif',
              source: '"Source Sans 3", system-ui, sans-serif',
              literata: '"Literata", Georgia, "Times New Roman", serif',
              merriweather: '"Merriweather", Georgia, "Times New Roman", serif',
              hyperlegible: '"Atkinson Hyperlegible", system-ui, sans-serif',
            };
            var fontId = localStorage.getItem("quillFont") || "system";
            var stack = fonts[fontId] || fonts.system;
            document.documentElement.dataset.font = fontId in fonts ? fontId : "system";
            document.documentElement.style.setProperty("--quill-font-family", stack);
          } catch (e) {
            document.documentElement.dataset.font = "system";
          }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
