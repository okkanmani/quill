server {
    listen 80;

    # Hashed build assets — safe to cache long-term.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # SPA shell must revalidate so deploys pick up new JS/CSS immediately.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
